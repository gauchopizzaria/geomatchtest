# Sidekiq Cron schedule
# Carregado via sidekiq-cron (ex: config/initializers/sidekiq_cron.rb)
#
# Docs: https://github.com/sidekiq-cron/sidekiq-cron

expire_subscriptions:
  cron: "0 3 * * *"
  class: "ExpireSubscriptionsJob"
  queue: default
  description: "Faz downgrade para Free quando premium_until expirou"

reconcile_pending_deposits:
  cron: "*/15 * * * *"
  class: "ReconcilePendingDepositsJob"
  queue: default
  description: "Consulta o Mercado Pago e credita depósitos aprovados cuja notificação de webhook se perdeu"

check_pending_payouts:
  cron: "*/10 * * * *"
  class: "CheckPendingPayoutsJob"
  queue: default
  description: "Confirma no provedor os PIX de saque já enviados e dá baixa nos que compensaram"


