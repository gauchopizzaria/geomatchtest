"pt-BR":
  # money-rails está com locale_backend :i18n (config/initializers/money.rb) e lê
  # separator/delimiter daqui. Sem estas chaves ele caía no padrão em inglês e
  # formatava o saldo da carteira como "R$0.00" em vez de "R$ 0,00".
  number:
    format:
      separator: ","
      delimiter: "."
      precision: 2
    currency:
      format:
        format: "%u %n"
        unit: "R$"
        separator: ","
        delimiter: "."
        precision: 2

  activerecord:
    errors:
      messages:
        record_invalid: "A validação falhou: %{errors}"
        required: "é obrigatório"
        taken: "já está em uso"
        blank: "não pode ficar em branco"
        too_short: "é muito curto (mínimo: %{count} caracteres)"
        too_long: "é muito longo (máximo: %{count} caracteres)"
        invalid: "não é válido"
        confirmation: "não coincide com %{attribute}"
        inclusion: "não está incluído na lista"
      models:
        user:
          attributes:
            email:
              taken: "já está cadastrado. Tente fazer login ou use outro e-mail."
              blank: "não pode ficar em branco"
              invalid: "não é um endereço de e-mail válido"
            password:
              too_short: "deve ter no mínimo %{count} caracteres"
              blank: "não pode ficar em branco"
            name:
              blank: "não pode ficar em branco"
        payment:
          attributes:
            plan:
              required: "é obrigatório"
            user:
              required: "é obrigatório"
    attributes:
      user:
        email: "E-mail"
        password: "Senha"
        password_confirmation: "Confirmação de senha"
        name: "Nome completo"
        current_password: "Senha atual"

